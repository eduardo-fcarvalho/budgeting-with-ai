name: budgeting-pilot
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: budgeting
      POSTGRES_USER: budgeting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina a senha do banco}
    volumes:
      - diary_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgeting -d budgeting"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/budgeting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  diary_data:
