spring.application.name=budgeting
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/budgeting}
spring.datasource.username=${POSTGRES_USER:budgeting}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=14d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1100KB
server.error.include-message=never
server.port=${PORT:8080}
