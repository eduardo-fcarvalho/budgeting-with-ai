# Verifica os guardrails, a API e a PWA do piloto.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'bg-*']

# Um push novo no mesmo PR cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A lógica dos git hooks e do hook do Claude Code: casos que passam e que devem ser
  # barrados, com e sem agent_type. O Python do runner basta: os testes só usam a stdlib.
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0: as conferências do PR comparam com a origin/main, que um clone raso não tem.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Testes dos guardrails
        run: python3 -m unittest discover -v -s scripts/guardrails

      # Falham: segredo, planilha, migração aplicada (com stack) e restart: no compose.
      # Só avisam: dependência, caminho de guardrail e rotina do card.
      # Os nomes passam por env, não por ${{ }} no script: um nome de branch não vira comando.
      - name: Conferências do PR
        if: github.event_name == 'pull_request'
        run: python3 scripts/guardrails/guardrails.py pr "origin/$BASE" "$BRANCH"
        env:
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: budgeting
          POSTGRES_USER: budgeting
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U budgeting" --health-interval=5s --health-retries=12
    env:
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
